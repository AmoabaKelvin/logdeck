name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1c30154a387214494e77fad7672e39e
          CF_BUILD_ENV: ${{ secrets.CF_BUILD_ENV }}
        run: |
          if [ -n "$CF_BUILD_ENV" ]; then
            printf '%s' "$CF_BUILD_ENV" > .env.ci
            set -a; . ./.env.ci; set +a
          fi
          bun run deploy
      # Tell Bing, Yandex, and the other IndexNow engines what is on the site.
      # The key is public by design; it is served at /<key>.txt.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 8983ce89cc7e616243489b295ad0136d
        run: |
          curl -fsS https://logdeck.dev/sitemap.xml \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | jq -R . | jq -s --arg key "$INDEXNOW_KEY" \
              '{host: "logdeck.dev", key: $key, keyLocation: "https://logdeck.dev/\($key).txt", urlList: .}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
