version: 2

project_name: logdeck

builds:
  - dir: server
    main: ./cmd/logdeck
    binary: logdeck
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    # Unversioned names keep releases/latest/download URLs stable for install.sh
    name_template: logdeck_{{ .Os }}_{{ .Arch }}
    files: [none*]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  # release-please creates the release and writes the notes
  mode: keep-existing
  replace_existing_artifacts: true

